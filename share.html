
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psycho Share</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:22px}
.container{max-width:480px;margin:35px auto;background:#1c293b;padding:24px;border-radius:22px}
h1{text-align:center;color:#65e6b3}
p{text-align:center;color:#bdc9d8}
.card{background:#293a50;padding:18px;border-radius:15px;margin-top:18px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#65e6b3;color:#10251e;font-size:16px;font-weight:bold;margin-top:12px}
input{width:100%;margin-top:12px;color:white}
#status{font-size:14px;color:#65e6b3}
</style>
</head>
<body>
<div class="container">
<h1>Psycho Share</h1>
<p>Send & Receive Files</p>

<div class="card">
<h3>📤 Send Files</h3>
<input type="file" id="file">
<button onclick="sendFile()">Send File</button>
<p id="status"></p>
</div>

<div class="card">
<h3>📥 Receive Files</h3>
<p>এখানে পাওয়া ফাইলের লিংক দেখাবে।</p>
<div id="received"></div>
</div>
</div>
<script>
function sendFile(){
 const f=document.getElementById('file').files[0];
 if(!f){alert('আগে একটি ফাইল নির্বাচন করো');return;}
 document.getElementById('status').textContent=
 'ফাইল নির্বাচিত: '+f.name+' ('+Math.round(f.size/1024)+' KB)। সার্ভার সংযোগ এখনো সেটআপ হয়নি।';
}
</script>
</body>
</html>
