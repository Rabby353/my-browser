
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psycho Share</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:white;font-family:Arial}
main{max-width:480px;margin:25px auto;background:#1c293b;padding:22px;border-radius:20px}
h1{text-align:center;color:#65e6b3}
p{color:#bdc9d8}
input{width:100%;padding:12px;margin:8px 0;border-radius:9px;border:1px solid #52647b;background:#293a50;color:white}
button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:10px;background:#65e6b3;color:#10251e;font-weight:bold}
.card{background:#293a50;padding:15px;margin-top:15px;border-radius:14px}
.file{padding:12px;border-bottom:1px solid #52647b;overflow-wrap:anywhere}
#status{color:#65e6b3;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>🖤 Psycho Share</h1>
<p style="text-align:center">Send & Receive Files</p>

<section id="login" class="card">
<h3>🔐 Login</h3>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="loginUser()">Login</button>
</section>

<section id="app" class="hidden">
<div class="card">
<p id="user"></p>
<button onclick="logoutUser()">Logout</button>
</div>
<div class="card">
<h3>📤 Send Files</h3>
<input id="file" type="file">
<button onclick="uploadFile()">Upload File</button>
</div>
<div class="card">
<h3>📥 Receive Files</h3>
<button onclick="loadFiles()">Refresh Files</button>
<div id="files"></div>
</div>
</section>
<p id="status"></p>
<p>Maximum file size: 50 MB</p>
</main>
<script type="module">

import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://ksxqdqssrfkfaqzifacb.supabase.co',
  'sb_publishable_zLyEMeumq0jcbmNucooz7g_2sRspKwP'
);

const bucket = 'psycho-files';
const $ = id => document.getElementById(id);

function message(t) {
  $('status').textContent = t;
}

function showApp(session) {
  $('login').classList.toggle('hidden', !!session);
  $('app').classList.toggle('hidden', !session);

  if (session) {
    $('user').textContent = 'Logged in: ' + session.user.email;
    loadFiles();
  }
}

async function loginUser() {
  const email = $('email').value.trim();
  const password = $('password').value;

  if (!email || !password) {
    message('Email ও Password দাও');
    return;
  }

  message('Logging in...');

  const { data, error } = await supabase.auth.signInWithPassword({
    email, password
  });

  if (error) {
    message(error.message);
    return;
  }

  showApp(data.session);
  message('Login successful!');
}
window.loginUser = loginUser;

async function logoutUser() {
  await supabase.auth.signOut();
  showApp(null);
  message('Logged out');
}
window.logoutUser = logoutUser;

async function uploadFile() {
  const f = $('file').files[0];

  if (!f) {
    message('আগে একটি ফাইল নির্বাচন করো');
    return;
  }

  if (f.size > 50 * 1024 * 1024) {
    message('ফাইল ৫০ MB-এর বেশি');
    return;
  }

  message('Uploading...');

  const safeName = f.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const path = Date.now() + '_' + safeName;

  const { error } = await supabase.storage
    .from(bucket).upload(path, f);

  if (error) {
    message(error.message);
    return;
  }

  $('file').value = '';
  message('Upload successful!');
  loadFiles();
}
window.uploadFile = uploadFile;

async function loadFiles() {
  const { data, error } = await supabase.storage
    .from(bucket)
    .list('', {
      limit: 100,
      sortBy: { column: 'created_at', order: 'desc' }
    });

  if (error) {
    message(error.message);
    return;
  }

  $('files').innerHTML = '';

  if (!data.length) {
    $('files').textContent = 'এখনো কোনো ফাইল নেই';
    return;
  }

  data.filter(x => x.name).forEach(item => {
    const div = document.createElement('div');
    div.className = 'file';

    const name = document.createElement('p');
    name.textContent = item.name;

    const btn = document.createElement('button');
    btn.textContent = 'Download';
    btn.onclick = () => downloadFile(item.name);

    div.append(name, btn);
    $('files').append(div);
  });
}
window.loadFiles = loadFiles;

async function downloadFile(name) {
  message('Downloading...');

  const { data, error } = await supabase.storage
    .from(bucket).download(name);

  if (error) {
    message(error.message);
    return;
  }

  const url = URL.createObjectURL(data);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 60000);
  message('Download started');
}

supabase.auth.onAuthStateChange((_event, session) => {
  showApp(session);
});

const { data: { session } } = await supabase.auth.getSession();
showApp(session);
</script>
</body>
</html>
