
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Messenger</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#075e54;
 display:flex;
 align-items:center;
 justify-content:center;
 min-height:100vh;
 padding:20px;
}
.card{
 background:white;
 border-radius:20px;
 padding:35px 22px;
 text-align:center;
 width:100%;
 max-width:360px;
 box-shadow:0 8px 30px #0003;
}
.logo{
 width:85px;height:85px;
 border-radius:50%;
 background:#25d366;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:52px;
 margin:auto;
}
h2{color:#075e54}
p{color:#666;line-height:1.6}
button{
 background:#25d366;
 color:white;
 border:0;
 border-radius:30px;
 padding:15px 25px;
 font-size:17px;
 font-weight:bold;
 width:100%;
}
small{display:block;margin-top:20px;color:#888}
</style>
</head>
<body>
<div class="card">
<div class="logo">☎</div>
<h2>WhatsApp Messenger</h2>
<p>Send messages and stay connected with your friends and family.</p>
<button onclick="window.open('https://web.whatsapp.com/','_blank')">
Open WhatsApp
</button>
<small>Official WhatsApp Web</small>
</div>
</body>
  </html>
